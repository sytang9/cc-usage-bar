name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jq, curl, node and bash are all preinstalled on ubuntu-latest runners.
      # Printed so a future runner-image change that drops one is obvious in the
      # log instead of surfacing as a confusing suite failure.
      - name: Show tool versions
        run: |
          bash --version | head -1
          jq --version
          curl --version | head -1
          node --version

      - name: Run test suites
        run: bash tests/run_all.sh
